<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의·예약 · 슈즈텔러</title>
<link rel="stylesheet" href="./forms.css">
<script src="./chat.js" defer></script>
</head>
<body>
<!-- 서버 .env SITE_COLLECT_ON=1일 때만 저장(꺼져 있으면 '오픈 준비 중'). 결제는 받지 않는다. -->
<main>
  <a class="back" href="./index.html">← 처음으로</a>
  <section id="form-wrap">
    <h1>문의·예약</h1>
    <p class="lead">예약 확정과 결제는 연락드린 뒤 안내해 드려요.</p>
    <form id="book-form" data-form="book" novalidate>
      <fieldset>
        <legend>무엇을 도와드릴까요 <span class="req">(필수)</span></legend>
        <label class="choice"><input type="radio" name="type" value="class"> <span>공방 수업 예약</span></label>
        <label class="choice"><input type="radio" name="type" value="premium"> <span>프리미엄 주문 문의</span></label>
        <label class="choice"><input type="radio" name="type" value="etc"> <span>기타 문의</span></label>
        <p class="err" id="err-type" aria-live="polite"></p>
      </fieldset>
      <div data-for="class" hidden>
        <fieldset>
          <label class="label" for="date">희망 날짜</label>
          <p><span class="todo">확인 필요: 수업 일정표</span></p>
          <input type="date" id="date" name="date">
        </fieldset>
        <fieldset>
          <label class="label" for="people">인원</label>
          <input type="number" id="people" name="people" min="1" inputmode="numeric" placeholder="1">
        </fieldset>
      </div>
      <div data-for="premium" hidden>
        <fieldset>
          <legend>디자인</legend>
          <label class="choice"><input type="radio" name="design" value="existing"> <span>기존 디자인</span></label>
          <label class="choice"><input type="radio" name="design" value="personal"> <span>개인 디자인</span></label>
        </fieldset>
        <fieldset>
          <label class="label" for="shoe">신발 종류·사이즈</label>
          <input type="text" id="shoe" name="shoe" placeholder="예: 흰 캔버스 스니커즈 250">
        </fieldset>
        <fieldset>
          <label class="label" for="feel">원하는 느낌 한 줄</label>
          <input type="text" id="feel" name="feel" placeholder="이 신발을 신고 어디에 가고 싶어요?">
        </fieldset>
      </div>
      <div data-for="etc" hidden>
        <fieldset>
          <label class="label" for="message">문의 내용</label>
          <textarea id="message" name="message"></textarea>
        </fieldset>
      </div>
      <fieldset>
        <label class="label" for="name">이름 <span class="req">(필수)</span></label>
        <input type="text" id="name" name="name" autocomplete="name">
        <p class="err" id="err-name" aria-live="polite"></p>
      </fieldset>
      <fieldset>
        <label class="label" for="phone">연락처(휴대폰) <span class="req">(필수)</span></label>
        <input type="tel" id="phone" name="phone" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel">
        <p class="err" id="err-phone" aria-live="polite"></p>
      </fieldset>
      <fieldset>
        <legend>어디서 알게 되셨나요 (선택)</legend>
        <select id="source" name="source">
          <option value="">골라 주세요</option>
          <option>인스타그램</option><option>유튜브</option><option>아이디어스</option>
          <option>스마트스토어</option><option>지인 소개</option><option>기타</option>
        </select>
        <div id="source-etc-wrap" hidden>
          <input type="text" id="source_etc" name="source_etc" maxlength="40" placeholder="어디서 보셨는지 적어 주세요" aria-label="기타 유입 경로">
        </div>
      </fieldset>
      <div aria-hidden="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden">
        <label for="website">비워 두세요</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <fieldset class="consent">
        <label class="choice"><input type="checkbox" name="agree_required" id="agree_required">
          <span><span class="req">[필수]</span> 개인정보 수집·이용 동의: 쿠폰 발급과 예약·문의 안내를 위해 이름·휴대폰 번호를 수집·이용합니다. 동의하지 않으면 신청할 수 없어요. <a href="./privacy.html" target="_blank" rel="noopener">처리방침 보기</a></span></label>
        <p class="err" id="err-agree_required" aria-live="polite"></p>
        <label class="choice"><input type="checkbox" name="marketing_opt_in" id="marketing_opt_in">
          <span>[선택] 마케팅 수신 동의: 슈즈텔러 수업·키트 소식과 혜택(광고성 정보)을 문자·카카오로 받겠습니다. 동의하지 않아도 쿠폰과 예약은 그대로예요.</span></label>
      </fieldset>
      <p class="err" id="err-form" aria-live="polite"></p>
      <button type="submit">보내기</button>
    </form>
  </section>
  <section id="done" class="done" hidden tabindex="-1">
    <h1 id="done-title"></h1>
    <p id="done-msg"></p>
    <p class="note"><span class="todo">확인 필요: 응답 시간</span></p>
    <p><span class="todo">확인 필요: 카카오 채널 링크 / 인스타그램 DM 주소</span></p>
    <a class="btn sub" href="./index.html">처음으로 돌아가기</a>
  </section>
</main>
<script src="./config.js"></script>
<script src="./forms.js"></script>
</body>
</html>
