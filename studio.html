<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스튜디오 — 내 디자인 만들기 · 슈즈텔러</title>
<meta name="description" content="부위마다 색을 고르고 패턴·글자·그림을 올려 세상에 하나뿐인 신발을 디자인하세요. 완성한 디자인 그대로 비움 작가가 그려드려요.">
<link rel="stylesheet" href="./site.css">
<script src="./config.js"></script>
<script src="./shoe.js"></script>
</head>
<body data-page="studio">
<main class="studio" aria-label="디자인 스튜디오">
  <section class="studio-canvas">
    <div class="studio-top">
      <button class="btn small" type="button" id="undo" aria-label="되돌리기">되돌리기</button>
      <button class="btn small" type="button" id="redo" aria-label="다시 실행">다시</button>
      <button class="btn small" type="button" id="reset">흰 신발로</button>
      <button class="btn small" type="button" id="save">그림 저장</button>
    </div>
    <svg id="shoe" role="img" aria-label="내 신발 디자인. 부위를 누르면 고를 수 있어요"></svg>
    <div class="studio-hint" id="hint">부위를 누르고 색을 고르세요</div>
  </section>

  <aside class="tools" aria-label="디자인 도구">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="color">색</button>
      <button role="tab" aria-selected="false" data-tab="pattern">패턴</button>
      <button role="tab" aria-selected="false" data-tab="text">글자</button>
      <button role="tab" aria-selected="false" data-tab="sticker">그림</button>
      <button role="tab" aria-selected="false" data-tab="preset">조합</button>
    </div>
    <div class="tool-body">
      <div data-pane="color">
        <h4>부위</h4>
        <div class="parts" id="parts"></div>
        <h4>물감</h4>
        <div class="swatches" id="swatches"></div>
      </div>
      <div data-pane="pattern" hidden>
        <h4>부위</h4>
        <div class="parts" id="parts2"></div>
        <h4>패턴</h4>
        <div class="pats" id="pats"></div>
        <h4 style="margin-top:16px">패턴 색</h4>
        <div class="swatches" id="pswatches"></div>
      </div>
      <div data-pane="text" hidden>
        <div class="row"><label for="txt">글자</label><input class="field" id="txt" maxlength="16" placeholder="이름, 날짜, 한마디"></div>
        <div class="row"><label for="tfont">서체</label>
          <select class="field" id="tfont">
            <option value="Black Han Sans, Noto Sans KR, sans-serif">굵게</option>
            <option value="Noto Sans KR, sans-serif">보통</option>
            <option value="Georgia, 'Noto Serif KR', serif">세리프</option>
            <option value="'Courier New', monospace">타자기</option>
          </select></div>
        <div class="row"><label>글자 색</label><div class="swatches" id="tswatches"></div></div>
        <button class="btn small ghost" type="button" id="addtext">신발에 올리기</button>
        <h4 style="margin-top:18px">올린 것</h4>
        <div class="layer-list" id="tlayers"></div>
        <div id="tedit" hidden>
          <div class="row"><label for="tsize">크기</label><input class="range" type="range" id="tsize" min="12" max="72" value="30"></div>
          <div class="row"><label for="trot">기울기</label><input class="range" type="range" id="trot" min="-45" max="45" value="0"></div>
          <button class="btn small ghost" type="button" id="tdel">지우기</button>
        </div>
      </div>
      <div data-pane="sticker" hidden>
        <h4>그림 고르기</h4>
        <div class="stickers" id="stickers"></div>
        <div class="row" style="margin-top:14px"><label>그림 색</label><div class="swatches" id="sswatches"></div></div>
        <div class="row"><label for="upload">내 사진·그림 올리기</label><input class="field" type="file" id="upload" accept="image/*"></div>
        <p class="note">올린 그림은 이 기기에만 있고, 주문할 때 디자인과 함께 전달돼요.</p>
        <h4 style="margin-top:18px">올린 것</h4>
        <div class="layer-list" id="slayers"></div>
        <div id="sedit" hidden>
          <div class="row"><label for="ssize">크기</label><input class="range" type="range" id="ssize" min="0.3" max="2.5" step="0.05" value="1"></div>
          <div class="row"><label for="srot">기울기</label><input class="range" type="range" id="srot" min="-180" max="180" value="0"></div>
          <button class="btn small ghost" type="button" id="sdel">지우기</button>
        </div>
      </div>
      <div data-pane="preset" hidden>
        <h4>미리 만든 조합에서 시작하기</h4>
        <div class="shop-grid" id="presets" style="border-left:0"></div>
      </div>
    </div>
    <div class="tool-foot">
      <div class="sum"><span>커스텀 제작 1켤레</span><span id="price"></span></div>
      <button class="btn" type="button" id="order">이 디자인으로 주문하기</button>
      <p class="note">완성한 디자인 그대로 비움 작가가 그려요. 결제는 주문 확인 연락 때 안내해 드려요.</p>
    </div>
  </aside>
</main>

<script src="./site.js"></script>
<script src="./track.js"></script>
<script src="./order.js"></script>
<script src="./studio.js"></script>
<script src="./chat.js" defer></script>
</body>
</html>
