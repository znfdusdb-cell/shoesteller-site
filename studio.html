<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커스텀 스튜디오 — BIUM</title>
<meta name="description" content="신발 모델을 고르고 색을 칠하고 내 그림과 글자를 올려 보세요. 만든 디자인 그대로 비움 작가가 손으로 그려 드려요.">
<link rel="icon" type="image/png" href="assets/brand/logo-black-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Hanken+Grotesk:wght@300;400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/products.js"></script>
</head>
<body>
<main id="main" class="st-page">
  <div class="st-head"><h1 class="st-title">CUSTOM STUDIO</h1><p>신발을 고르고, 칠하고, 내 그림을 올려 보세요. 만든 그대로 손으로 그려 드려요.</p></div>

  <div class="st">
    <div class="st-stage">
      <div class="st-canvas-wrap" id="wrap">
        <canvas id="cv" width="1600" height="800" aria-label="내 신발 디자인"></canvas>
        <div class="st-empty" id="empty" hidden>신발을 먼저 골라 주세요</div>
      </div>
      <div class="st-views" id="views" hidden></div>
      <div class="st-bar">
        <button type="button" id="undo" aria-label="되돌리기">↶ 되돌리기</button>
        <button type="button" id="redo" aria-label="다시">↷ 다시</button>
        <button type="button" id="clear">처음부터</button>
        <button type="button" id="dl">내 스튜디오에 저장</button>
      </div>
      <p class="st-hint" id="hint">신발 안쪽을 누르면 그 칸이 칠해져요</p>
    </div>

    <aside class="st-panel">
      <section class="st-step">
        <h2><span>1</span> 신발 고르기</h2>
        <div class="st-models" id="models"></div>
        <div class="st-colors" id="colors" hidden></div>
        <p class="st-note" id="model-note"></p>
        <label class="st-photo"><input type="file" accept="image/*" id="photo"> 내 신발 사진으로 하기 <small>옆에서 찍은 사진이 가장 좋아요</small></label>
      </section>

      <section class="st-step">
        <h2><span>2</span> 꾸미기</h2>
        <div class="st-tabs" role="tablist">
          <button type="button" role="tab" data-tool="fill" class="on">칠하기</button>
          <button type="button" role="tab" data-tool="brush">붓</button>
          <button type="button" role="tab" data-tool="image">그림 올리기</button>
          <button type="button" role="tab" data-tool="text">글자</button>
        </div>
        <div class="st-pane" data-pane="color">
          <div class="st-sw" id="sw"></div>
          <label class="st-custom">다른 색 <input type="color" id="pick" value="#c8102e"></label>
          <button type="button" class="btn line small st-baseall" id="base-all">이 색을 신발 바탕색으로 (4면 모두)</button>
        </div>
        <div class="st-pane" data-pane="brush" hidden>
          <label class="st-lbl">붓 굵기 <input type="range" id="bsize" min="4" max="60" value="16"></label>
        </div>
        <div class="st-pane" data-pane="image" hidden>
          <label class="btn line wide st-file"><input type="file" accept="image/*" id="img"> 사진·그림 고르기</label>
          <p class="st-note">좋아하는 캐릭터, 반려동물, 선수, 손글씨 무엇이든요. 올린 뒤 손가락으로 옮기고, 두 손가락으로 크기와 각도를 바꿔요.</p>
        </div>
        <div class="st-pane" data-pane="text" hidden>
          <div class="st-model"><input id="txt" type="text" maxlength="20" placeholder="이름, 날짜, 한마디"><button type="button" id="txt-add">올리기</button></div>
          <label class="st-lbl" for="font">글씨체</label>
          <select id="font"><option value="700 1px Archivo, sans-serif">ARCHIVO 굵게</option><option value="700 1px 'Noto Sans KR', sans-serif">한글 굵게</option><option value="400 1px Georgia, serif">세리프</option><option value="italic 400 1px 'Brush Script MT', cursive">손글씨</option></select>
        </div>
        <div class="st-sel" id="sel" hidden>
          <b>고른 것</b>
          <label class="st-lbl">크기 <input type="range" id="scale" min="10" max="300" value="100"></label>
          <label class="st-lbl">회전 <input type="range" id="rot" min="-180" max="180" value="0"></label>
          <div class="st-row"><button type="button" class="btn line small" id="front">맨 앞으로</button><button type="button" class="btn line small" id="del">지우기</button></div>
        </div>
      </section>

      <section class="st-step" id="quote">
        <h2><span>3</span> 저장하고 견적 보기</h2>
        <div class="seg" id="q-src"><button type="button" class="on" data-v="new">새 신발로 (작가가 준비)</button><button type="button" data-v="mine">내 신발 보내기</button></div>
        <div class="st-quote" id="q-box"></div>
        <div class="st-row2"><button class="btn wide" type="button" id="q-save">내 스튜디오에 저장</button></div>
        <details class="st-ask" id="q-ask"><summary>작가에게 견적 확인 받기</summary>
          <form class="fm" id="of" novalidate>
            <fieldset><label class="label" for="o-size">사이즈 <span class="req">(필수)</span></label><select id="o-size"></select><p class="err" id="e-size"></p></fieldset>
            <fieldset><label class="label" for="o-memo">작가에게 한마디</label><textarea id="o-memo" rows="3" placeholder="이 그림은 오른쪽 신발에만, 글자는 뒤꿈치에… 처럼 적어 주세요"></textarea></fieldset>
            <div class="two"><fieldset><label class="label" for="o-name">이름 <span class="req">(필수)</span></label><input type="text" id="o-name" autocomplete="name"><p class="err" id="e-name"></p></fieldset>
            <fieldset><label class="label" for="o-phone">휴대폰 <span class="req">(필수)</span></label><input type="tel" id="o-phone" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel"><p class="err" id="e-phone"></p></fieldset></div>
            <fieldset><label class="check"><input type="checkbox" id="o-agree"><span><b>[필수]</b> 견적·주문 연락을 위해 이름과 연락처를 쓰는 데 동의해요. <a href="privacy.html">자세히</a></span></label><p class="err" id="e-agree"></p></fieldset>
            <button class="btn line wide" type="submit" id="o-send">이 디자인으로 견적 받기</button>
          </form>
          <div class="done" id="o-done" hidden></div>
        </details>
      </section>
    </aside>
  </div>
</main>
<script src="assets/site.js"></script>
<script src="assets/studio.js"></script>
</body>
</html>
