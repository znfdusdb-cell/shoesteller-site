<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈즈텔러 커스텀 신발</title>
<meta name="description" content="손으로 그리는 커스텀 신발. 사계절 꽃신, 축구 커스텀, 내 이야기를 담은 한 켤레. 슈즈텔러 비움.">
<link rel="icon" type="image/png" href="assets/brand/logo-black-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Hanken+Grotesk:wght@300;400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/products.js"></script>
</head>
<body>
<main id="main">
  <section class="hero" id="top" aria-label="작업 영상">
    <video id="hero-video" autoplay muted loop playsinline preload="metadata" aria-label="흰 신발에 붓으로 그림을 그리는 작업 장면"></video>
    <script>(function () { var V = (window.SHOES && window.SHOES.VIDEO) || {}, v = document.getElementById('hero-video'), h = '';
      var mob = window.matchMedia('(max-width: 759px)').matches; if (mob && V.poster_mobile) v.setAttribute('poster', V.poster_mobile); else if (V.poster) v.setAttribute('poster', V.poster);
      if (V.mobile) h += '<source src="' + V.mobile + '" type="video/mp4" media="(max-width: 759px)">';
      if (V.webm) h += '<source src="' + V.webm + '" type="video/webm">';
      if (V.desktop) h += '<source src="' + V.desktop + '" type="video/mp4">';
      v.innerHTML = h; v.load(); })();</script>
    <button class="mute" type="button" id="toggle-play" aria-label="영상 멈춤"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg></button>
    <div class="over"><p class="big" data-t="hero.lbl2"></p><a class="btn cream" href="shop.html" data-t="hero.shop"></a></div>
  </section>

  <section class="msec" id="works" aria-labelledby="works-h">
    <p class="mtitle" id="works-h" data-t="works.h"></p>
    <div class="mbar wrap">
      <div class="mtabs" role="tablist" aria-label="작품 종류" id="work-tabs">
        <button role="tab" aria-selected="true" data-tab="all" data-t="nav.all"></button>
        <button role="tab" aria-selected="false" data-tab="flower" data-t="nav.flower"></button>
        <button role="tab" aria-selected="false" data-tab="story" data-t="nav.story2"></button>
      </div>
      <div class="mright"><a class="ulink" href="shop.html" data-t="works.view"></a><div class="arrows"><button type="button" data-dir="-1" data-for="work-track" aria-label="이전">&#8249;</button><button type="button" data-dir="1" data-for="work-track" aria-label="다음">&#8250;</button></div></div>
    </div>
    <div class="track" id="work-track"></div>
  </section>

  <section class="hero banner2" aria-labelledby="fb-h">
    <picture><source media="(max-width: 759px)" srcset="assets/fb/f09.jpg"><img src="assets/fb/f03.jpg" alt="파란 하늘 아래 축구장에서 신은 포그바 커스텀 신발" loading="lazy"></picture>
    <div class="over"><p class="big" id="fb-h" data-t="fb2.h"></p><a class="btn cream" href="shop.html?cat=football" data-t="fb2.btn"></a></div>
  </section>

  <section class="msec" aria-labelledby="fbx-h">
    <p class="mtitle" id="fbx-h" data-t="fb2.ex"></p>
    <div class="mbar wrap"><div class="mtabs"><a class="ulink" href="book.html?type=order&design=personal" data-t="fb.btn"></a></div>
      <div class="mright"><a class="ulink" href="shop.html?cat=football" data-t="works.view"></a><div class="arrows"><button type="button" data-dir="-1" data-for="fb-track" aria-label="이전">&#8249;</button><button type="button" data-dir="1" data-for="fb-track" aria-label="다음">&#8250;</button></div></div></div>
    <div class="track" id="fb-track"></div>
  </section>

  <section class="msec looksec" id="looks" aria-labelledby="looks-h">
    <p class="mtitle" id="looks-h">SHOP OUR LOOKS</p>
    <div class="lk-m">
      <div class="lk-track" id="look-grid"></div>
      <button class="btn lk-btn" type="button" id="lk-view" data-t="look.btn"></button>
    </div>
    <div class="lk-d wrap">
      <button class="lk-nav prev" type="button" aria-label="이전 룩">&#8249;</button>
      <div class="lk-stage" id="look-desk"></div>
      <button class="lk-nav next" type="button" aria-label="다음 룩">&#8250;</button>
    </div>
  </section>

  <section class="msec stsec" id="studio" aria-labelledby="studio-h">
    <p class="mtitle" id="studio-h">CUSTOM STUDIO</p>
    <div class="ba" id="ba">
      <img class="ba-after" alt="그림을 그린 뒤의 신발" loading="lazy">
      <div class="ba-before"><img alt="그리기 전 흰 신발" loading="lazy"></div>
      <div class="ba-line"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg></span></div>
      <input type="range" min="0" max="100" value="50" aria-label="그리기 전과 후 비교">
    </div>
    <div class="ba-caps wrap"><div><span data-t="ba.before"></span><a class="ulink" href="studio.html" data-t="studio.btn"></a></div><div><span data-t="ba.after"></span><a class="ulink" id="ba-prod" href="shop.html" data-t="look.view"></a></div></div>
    <div class="st-cta wrap">
      <p data-t="studio.p"></p>
      <form class="st-model" id="st-go" action="studio.html"><input name="model" type="text" data-tp="studio.ph" autocomplete="off" aria-label="신발 모델명"><button type="submit" data-t="studio.go"></button></form>
    </div>
  </section>

  <section class="msec" id="discover" aria-labelledby="disc-h">
    <p class="mtitle" id="disc-h" data-t="disc2.h"></p>
    <div class="pillars">
      <a href="class.html#workshop"><img src="assets/p01.jpg" alt="프리지아를 칠하는 손" loading="lazy"><span><b data-t="class.1"></b><i data-t="class.1p"></i></span></a>
      <a href="class.html#kit"><img src="assets/kit.jpg" alt="흰 운동화 꽃 그림 커스텀 키트" loading="lazy"><span><b data-t="class.2"></b><i data-t="class.2p"></i></span></a>
      <a href="class.html#online"><img src="assets/13-l.jpg" alt="벚꽃을 그린 흰 벨크로 신발" loading="lazy"><span><b data-t="class.3"></b><i data-t="class.3p"></i></span></a>
    </div>
  </section>

  <section class="msec" id="story" aria-labelledby="story-h">
    <p class="mtitle" id="story-h" data-t="story.h"></p>
    <div class="wrap story"><p id="about-p"></p><p class="mute2" data-t="disc.p2"></p><a class="ulink" href="https://www.youtube.com/@bium4581">YouTube</a></div>
  </section>

  <section class="msec" id="faq" aria-labelledby="faq-h">
    <p class="mtitle" id="faq-h" data-t="faq2.h"></p>
    <div class="wrap faqw"><div class="faq" id="faq-list"></div></div>
  </section>
</main>
<script src="assets/site.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SHOES, B = window.BIUM;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };

  /* 새 작품 캐러셀 (탭) + 축구 캐러셀 */
  var wt = $('#work-track'), cat = 'all';
  function renderWorks() { wt.innerHTML = S.products.filter(function (p) { return p.cat !== 'football' && (cat === 'all' || p.cat === cat); }).map(B.cardHtml).join(''); B.applyLang(wt); wt.scrollLeft = 0; }
  $$('#work-tabs [role=tab]').forEach(function (t) { t.addEventListener('click', function () { cat = t.getAttribute('data-tab'); $$('#work-tabs [role=tab]').forEach(function (x) { x.setAttribute('aria-selected', x === t ? 'true' : 'false'); }); renderWorks(); }); });
  renderWorks();
  $('#fb-track').innerHTML = S.products.filter(function (p) { return p.cat === 'football'; }).map(B.cardHtml).join(''); B.applyLang($('#fb-track'));
  $$('.arrows button').forEach(function (b) { b.addEventListener('click', function () { var tr = $('#' + b.getAttribute('data-for')), c = $('.card', tr); tr.scrollBy({ left: (c ? c.getBoundingClientRect().width + 3 : 300) * Number(b.getAttribute('data-dir')), behavior: 'smooth' }); }); });

  /* 룩북: 메이슨식 */
  var track = $('#look-grid'), desk = $('#look-desk'), L = S.lookbook, curL = 0;
  function pinHtml(l, i) { var pin = l.pin || [50, 80], p = B.byId(l.product); return '<button class="lk-pin" type="button" data-look="' + i + '" style="left:' + pin[0] + '%;top:' + pin[1] + '%" aria-label="' + (p ? p.name : '') + ' 보기"></button>'; }
  function cardMini(p) { return '<a class="lkd-card" href="product.html?id=' + p.id + '">' + (p.isNew ? '<span class="lkd-new">NEW</span>' : '') + '<span class="lkd-img"><img src="' + p.photos[0] + '" alt="" loading="lazy"' + B.posAttr(p, 0) + '></span><span class="lkd-meta"><span>' + B.nameOf(p) + '</span><span>' + B.won(p.price) + '</span></span></a>'; }
  track.innerHTML = L.map(function (l, i) { return '<div class="lk"><div class="lk-ph"><img src="' + l.photo + '" alt="' + l.ko + ' 룩" loading="lazy">' + pinHtml(l, i) + '</div></div>'; }).join('');
  desk.innerHTML = L.map(function (l, i) {
    var p = B.byId(l.product); if (!p) return '';
    return '<div class="lkd' + (i ? '' : ' on') + '"><div class="lk-ph"><img src="' + l.photo + '" alt="' + l.ko + ' 룩" loading="lazy">' + pinHtml(l, i) + '</div>' +
      '<div class="lkd-p">' + cardMini(p) + '<a class="btn lkd-btn" href="product.html?id=' + p.id + '">VIEW PRODUCT</a>' +
      '<div class="lkd-dots">' + L.map(function (x, k) { return '<button type="button" data-go="' + k + '"' + (k === i ? ' aria-current="true"' : '') + ' aria-label="' + (k + 1) + '번째 룩"></button>'; }).join('') + '</div></div></div>';
  }).join('');
  function showDesk(i) { curL = (i + L.length) % L.length; $$('.lkd', desk).forEach(function (d, k) { d.classList.toggle('on', k === curL); }); }
  $('.lk-nav.prev').addEventListener('click', function () { showDesk(curL - 1); });
  $('.lk-nav.next').addEventListener('click', function () { showDesk(curL + 1); });
  desk.addEventListener('click', function (e) { var g = e.target.closest('[data-go]'); if (g) showDesk(+g.getAttribute('data-go')); });
  function curLook() { var best = 0, d = 1e9; Array.prototype.forEach.call(track.children, function (c, i) { var m = Math.abs(c.offsetLeft - track.offsetLeft - track.scrollLeft - 20); if (m < d) { d = m; best = i; } }); return best; }
  function sheet(i) {
    var l = L[i], p = B.byId(l.product); if (!p) return;
    $('#look-body').innerHTML = cardMini(p).replace('lkd-card', 'lkd-card sheet-card') +
      '<div class="lk-acts"><button class="btn" type="button" id="lk-add">' + (B.lang() === 'en' ? 'Add to bag' : '담기') + '</button><a class="btn line" href="product.html?id=' + p.id + '">' + B.t('look.view') + '</a></div>' +
      (l.items && l.items.length ? '<div class="lk-wear"><span class="lbl">' + B.t('look.wear') + '</span>' + l.items.map(function (it) { return '<p>' + it + '</p>'; }).join('') + '</div>' : '');
    $('#lk-add').addEventListener('click', function () { B.close('look-sheet'); B.quickAdd(p.id); });
    $$('.lk-pin').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-look') === String(i) ? 'true' : 'false'); });
    B.open('look-sheet');
  }
  track.addEventListener('click', function (e) { var b = e.target.closest('[data-look]'); if (b) sheet(+b.getAttribute('data-look')); });
  $('#lk-view').addEventListener('click', function () { sheet(curLook()); });

  /* 커스텀 스튜디오: 비포·애프터 */
  var SD = S.STUDIO || {};
  $('#ba .ba-after').src = SD.after || ''; $('#ba .ba-before img').src = SD.before || '';
  if (SD.product) $('#ba-prod').href = 'product.html?id=' + SD.product;
  (function () {
    var ba = $('#ba'), rng = $('input', ba), dragging = false;
    function set(v) { v = Math.max(0, Math.min(100, v)); ba.style.setProperty('--x', v + '%'); rng.value = v; }
    rng.addEventListener('input', function () { set(+rng.value); });
    function at(e) { var r = ba.getBoundingClientRect(); set((e.clientX - r.left) / r.width * 100); }
    ba.addEventListener('pointerdown', function (e) { dragging = true; ba.setPointerCapture(e.pointerId); at(e); });
    ba.addEventListener('pointermove', function (e) { if (dragging) at(e); });
    ba.addEventListener('pointerup', function () { dragging = false; });
    set(50);
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (en) { if (en[0].isIntersecting) { io.disconnect(); var t0 = null; requestAnimationFrame(function step(t) { if (!t0) t0 = t; var k = (t - t0) / 1600; if (k < 1 && !dragging) { set(50 + 30 * Math.sin(k * Math.PI * 2)); requestAnimationFrame(step); } else if (!dragging) set(50); }); } }, { threshold: 0.5 });
      io.observe(ba);
    }
  })();

  /* 영상 */
  var v = $('#hero-video'), tp = $('#toggle-play');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { v.pause(); v.removeAttribute('autoplay'); }
  tp.addEventListener('click', function () { if (v.paused) { v.play().catch(function () {}); tp.setAttribute('aria-label', '영상 멈춤'); } else { v.pause(); tp.setAttribute('aria-label', '영상 재생'); } });

  $('#about-p').textContent = S.CONTENT.about;
  var C = S.CONTENT, FAQ = [['그림 실력이 없어도 내 이야기로 주문할 수 있나요?', '네. 이야기와 사진만 주시면 시안은 저희가 그려요. ' + C.revisions], ['제작은 얼마나 걸리나요?', C.lead_time], ['배송비는요?', C.shipping], ['내 신발을 보내도 되나요?', C.own_shoes], ['교환·환불은요?', C.returns], ['어떻게 관리하나요?', C.care], ['사이즈는 어떻게 골라요?', C.size_guide]];
  $('#faq-list').innerHTML = FAQ.map(function (q) { return '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>'; }).join('');
  if (location.hash === '#works') $('#works').scrollIntoView();
})();
</script>
</body>
</html>
