<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈즈텔러 커스텀 신발</title>
<meta name="description" content="손으로 그리는 커스텀 신발. 사계절 꽃신, 축구 커스텀, 내 이야기를 담은 한 켤레. 슈즈텔러 비움.">
<link rel="icon" type="image/png" href="assets/brand/logo-black-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/products.js"></script>
</head>
<body>
<main id="main">
  <section class="hero" id="top" aria-label="작업 영상">
    <video id="hero-video" autoplay muted loop playsinline preload="metadata" aria-label="흰 신발에 붓으로 그림을 그리는 작업 장면"></video>
    <script>(function () { var V = (window.SHOES && window.SHOES.VIDEO) || {}, v = document.getElementById('hero-video'), h = '';
      if (V.poster) v.setAttribute('poster', V.poster);
      if (V.mobile) h += '<source src="' + V.mobile + '" type="video/mp4" media="(max-width: 759px)">';
      if (V.webm) h += '<source src="' + V.webm + '" type="video/webm">';
      if (V.desktop) h += '<source src="' + V.desktop + '" type="video/mp4">';
      v.innerHTML = h; v.load(); })();</script>
    <button class="mute" type="button" id="toggle-play" aria-label="영상 멈춤"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg></button>
    <div class="over"><div><span class="lbl" data-t="hero.lbl"></span><h1 data-t="hero.h1"></h1></div><a class="btn inv" href="#works" data-t="hero.btn"></a></div>
  </section>

  <section class="sec" id="works" aria-labelledby="works-h">
    <div class="wrap">
      <div class="sec-head">
        <div><h2 class="h2" id="works-h" data-t="works.h"></h2>
          <div class="tabs" role="tablist" aria-label="작품 종류" style="margin-top:14px" id="work-tabs">
            <button role="tab" aria-selected="true" data-tab="all" data-t="nav.all"></button>
            <button role="tab" aria-selected="false" data-tab="flower" data-t="nav.flower"></button>
            <button role="tab" aria-selected="false" data-tab="football" data-t="nav.football"></button>
            <button role="tab" aria-selected="false" data-tab="story" data-t="nav.story2"></button>
          </div></div>
        <div style="display:flex;gap:20px;align-items:center"><button class="link" type="button" id="show-all" data-t="works.all"></button><div class="arrows"><button type="button" data-dir="-1" aria-label="이전">←</button><button type="button" data-dir="1" aria-label="다음">→</button></div></div>
      </div>
      <div class="track" id="work-track"></div>
      <p class="sub" id="base-note" hidden style="margin-top:12px;font-size:13px;color:var(--grey-3)"></p>
    </div>
  </section>

  <section class="banner" aria-labelledby="fb-h">
    <div class="wrap">
      <div class="pics"><img src="assets/fb/f08.jpg" alt="파란 스우시 위에 두 팔을 벌린 무드릭 10번" loading="lazy"><img src="assets/fb/f07.jpg" alt="HAZARD 10 글자와 첼시 엠블럼을 그린 신발" loading="lazy"></div>
      <div class="txt"><span class="lbl" data-t="fb.lbl"></span><h2 id="fb-h" data-t="fb.h"></h2><p data-t="fb.p"></p><div><button class="btn inv" type="button" data-tab="football" data-goto="works" data-t="fb.btn"></button></div></div>
    </div>
  </section>

  <section class="sec" id="bases" aria-labelledby="bases-h">
    <div class="wrap">
      <div class="sec-head"><div><h2 class="h2" id="bases-h" data-t="cat.h"></h2><p style="color:var(--grey-3);margin-top:8px;max-width:36em" data-t="cat.p"></p></div></div>
      <div class="cats" id="base-cards"></div>
    </div>
  </section>

  <section class="sec" id="class" aria-labelledby="class-h" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head"><h2 class="h2" id="class-h" data-t="class.h"></h2><a class="link" href="book.html?type=class" data-t="class.btn"></a></div>
      <div class="trio">
        <a class="cat" href="class.html#workshop"><span class="when">2026.11</span><img src="assets/p01.jpg" alt="프리지아를 칠하는 손" loading="lazy"><div class="cap"><b data-t="class.1"></b><span data-t="class.1p"></span></div></a>
        <a class="cat" href="class.html#kit"><span class="when">2027.01</span><img src="assets/09.jpg" alt="나무 벤치 위 프리지아 그림 운동화" loading="lazy"><div class="cap"><b data-t="class.2"></b><span data-t="class.2p"></span></div></a>
        <a class="cat" href="class.html#online"><span class="when">2027.03</span><img src="assets/13-l.jpg" alt="벚꽃을 그린 흰 벨크로 신발" loading="lazy"><div class="cap"><b data-t="class.3"></b><span data-t="class.3p"></span></div></a>
      </div>
    </div>
  </section>

  <section class="sec color" aria-labelledby="color-h" style="background:var(--grey-1)">
    <div class="wrap">
      <div class="ph"><img src="assets/04.jpg" class="on" data-color="pink" alt="분홍 스우시 벚꽃 운동화"><img src="assets/10.jpg" data-color="lilac" alt="연보라 스우시 코스모스 운동화" loading="lazy"></div>
      <div class="txt"><span class="lbl" data-t="color.lbl"></span><h2 id="color-h" data-t="color.h"></h2><p style="color:var(--grey-3)" data-t="color.p"></p>
        <div class="sw" role="group" aria-label="스우시 색"><button type="button" aria-pressed="true" data-color="pink" data-pid="cherry"><i style="background:#F2A7C0"></i><span data-t="color.1"></span></button><button type="button" aria-pressed="false" data-color="lilac" data-pid="cosmos"><i style="background:#B9A6DC"></i><span data-t="color.2"></span></button></div>
        <div><a class="link" id="color-link" href="product.html?id=cherry" data-t="color.btn"></a></div></div>
    </div>
  </section>

  <section class="sec looksec" id="looks" aria-labelledby="looks-h">
    <h2 class="looks-title" id="looks-h">SHOP OUR LOOKS</h2>
    <div class="lk-wrap">
      <button class="lk-nav prev" type="button" aria-label="이전 룩">&#8592;</button>
      <div class="lk-track" id="look-grid"></div>
      <button class="lk-nav next" type="button" aria-label="다음 룩">&#8594;</button>
    </div>
    <div class="lk-dots" id="look-dots"></div>
  </section>

  <section class="sec" id="story" aria-labelledby="story-h" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head"><h2 class="h2" id="story-h"><span data-t="disc.h"></span> <span class="kr" data-t="disc.kr"></span></h2><a class="link" href="https://www.youtube.com/@bium4581">YouTube</a></div>
      <div class="discover"><img src="assets/05.jpg" alt="꽃잎이 떨어진 땅 위의 벚꽃 운동화" loading="lazy"><img src="assets/09.jpg" alt="나무 벤치 위 프리지아 운동화" loading="lazy"><img src="assets/fb/f05.jpg" alt="제라드 초상을 그린 신발 옆면" loading="lazy"></div>
      <div style="display:grid;gap:12px;max-width:40em;margin-top:28px"><p id="about-p"></p><p style="color:var(--grey-3);font-size:13px" data-t="disc.p2"></p></div>
    </div>
  </section>

  <section class="sec" id="faq" aria-labelledby="faq-h" style="padding-top:0">
    <div class="wrap" style="max-width:860px">
      <h2 class="h2" id="faq-h" style="margin-bottom:20px" data-t="faq.h"></h2>
      <div class="faq" id="faq-list"></div>
    </div>
  </section>

  <section class="news" aria-labelledby="news-h">
    <div class="wrap">
      <div><h2 class="h2" id="news-h" data-t="news.h"></h2><p style="margin-top:10px" data-t="news.p"></p></div>
      <form id="news-form"><label class="sr" for="email">이메일</label><input id="email" type="email" data-tp="news.ph" required autocomplete="email"><button class="btn" type="submit" data-t="news.btn"></button></form>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SHOES, B = window.BIUM;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };

  /* 작품 목록: 탭(종류) + 신발 종류 필터 */
  var track = $('#work-track'), tabs = $$('#work-tabs [role="tab"]'), cur = 'all', base = null, asGrid = false;
  function render() {
    var list = S.products.filter(function (p) { return (cur === 'all' || p.cat === cur) && (!base || p.base === base); });
    track.innerHTML = list.map(B.cardHtml).join('');
    track.className = asGrid ? 'grid' : 'track';
    B.applyLang(track);
    var note = $('#base-note');
    if (base) { var b = S.bases.filter(function (x) { return x.id === base; })[0]; note.hidden = false; note.innerHTML = (B.lang() === 'en' ? b.en : b.ko) + ' · ' + list.length + ' <button class="link" type="button" id="clear-base">×</button>'; $('#clear-base').addEventListener('click', function () { base = null; render(); }); }
    else note.hidden = true;
  }
  function showTab(name) { cur = name; tabs.forEach(function (t) { t.setAttribute('aria-selected', t.getAttribute('data-tab') === name ? 'true' : 'false'); }); render(); track.scrollLeft = 0; }
  tabs.forEach(function (t) { t.addEventListener('click', function () { showTab(t.getAttribute('data-tab')); }); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-tab]'); if (!a || a.getAttribute('role') === 'tab') return;
    showTab(a.getAttribute('data-tab')); base = null; render();
    if (a.getAttribute('data-goto') || a.getAttribute('href') === 'index.html#works') { e.preventDefault(); $('#works').scrollIntoView({ behavior: 'smooth' }); }
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-base]'); if (!a || a.classList.contains('card')) return;
    e.preventDefault(); base = a.getAttribute('data-base'); cur = 'all'; tabs.forEach(function (t) { t.setAttribute('aria-selected', t.getAttribute('data-tab') === 'all' ? 'true' : 'false'); }); asGrid = true; render(); $('#works').scrollIntoView({ behavior: 'smooth' });
  });
  $('#show-all').addEventListener('click', function () { asGrid = !asGrid; render(); });
  $$('.arrows button').forEach(function (b) { b.addEventListener('click', function () { var card = $('.card', track); var w = card ? card.getBoundingClientRect().width + 12 : 300; track.scrollBy({ left: w * Number(b.getAttribute('data-dir')), behavior: 'smooth' }); }); });
  render();

  /* 신발 종류 카드(사진) */
  var basePhoto = { low: 'assets/06.jpg', court: 'assets/10.jpg', high: 'assets/16.jpg', velcro: 'assets/fb/f01.jpg', slip: 'assets/14.jpg', boot: 'assets/15.jpg' };
  $('#base-cards').innerHTML = S.bases.map(function (b) {
    var n = S.products.filter(function (p) { return p.base === b.id; }).length;
    return '<a class="catc line" href="#works" data-base="' + b.id + '"><img class="lineart" src="assets/line/' + b.id + '.png" alt="" loading="lazy"><div class="cap"><b>' + (B.lang() === 'en' ? b.en : b.ko) + '</b><span>' + n + ' works</span></div></a>';
  }).join('');

  /* 룩북: 메이슨식 한 장씩 넘기기 */
  var track = $('#look-grid'), dots = $('#look-dots');
  track.innerHTML = S.lookbook.map(function (l, i) {
    var p = B.byId(l.product), pin = l.pin || [50, 80];
    return '<div class="lk" data-i="' + i + '"><div class="lk-ph"><img src="' + l.photo + '" alt="' + l.ko + ' 룩, ' + p.name + ' 착용" loading="lazy">' +
      '<button class="lk-pin" type="button" data-look="' + i + '" style="left:' + pin[0] + '%;top:' + pin[1] + '%" aria-label="' + p.name + ' 보기"><span></span></button>' +
      '<span class="lk-cap">' + (B.lang() === 'en' ? l.en : l.ko) + '</span></div>' +
      '<button class="btn wide lk-btn" type="button" data-look="' + i + '" data-t="look.btn"></button></div>';
  }).join('');
  dots.innerHTML = S.lookbook.map(function (l, i) { return '<button type="button" aria-label="' + (i + 1) + '번째 룩" data-dot="' + i + '"></button>'; }).join('');
  B.applyLang(track);
  function lookAt(i) { var c = track.children[i]; if (c) track.scrollTo({ left: c.offsetLeft - track.offsetLeft - (track.clientWidth - c.clientWidth) / 2, behavior: 'smooth' }); }
  function curLook() { var mid = track.scrollLeft + track.clientWidth / 2, best = 0, d = 1e9; Array.prototype.forEach.call(track.children, function (c, i) { var m = c.offsetLeft - track.offsetLeft + c.clientWidth / 2; if (Math.abs(m - mid) < d) { d = Math.abs(m - mid); best = i; } }); return best; }
  function syncDots() { var k = curLook(); $$('#look-dots button').forEach(function (b, i) { b.classList.toggle('on', i === k); }); }
  track.addEventListener('scroll', function () { clearTimeout(track._t); track._t = setTimeout(syncDots, 80); });
  syncDots();
  $('.lk-nav.prev').addEventListener('click', function () { lookAt(Math.max(0, curLook() - 1)); });
  $('.lk-nav.next').addEventListener('click', function () { lookAt(Math.min(S.lookbook.length - 1, curLook() + 1)); });
  dots.addEventListener('click', function (e) { var b = e.target.closest('[data-dot]'); if (b) lookAt(+b.getAttribute('data-dot')); });
  track.addEventListener('click', function (e) {
    var b = e.target.closest('[data-look]'); if (!b) return;
    var l = S.lookbook[+b.getAttribute('data-look')], p = B.byId(l.product);
    $('#look-body').innerHTML = '<div class="lk-item"><a class="lk-thumb" href="product.html?id=' + p.id + '"><img src="' + p.photos[0] + '" alt=""></a><div><a class="lk-name" href="product.html?id=' + p.id + '">' + B.nameOf(p) + '</a><p class="lk-price">' + B.won(p.price) + '</p><div class="lk-acts"><button class="btn" type="button" id="lk-add">' + (B.lang() === 'en' ? 'Add to bag' : '담기') + '</button><a class="btn line" href="product.html?id=' + p.id + '">' + B.t('look.view') + '</a></div></div></div>' +
      '<div class="lk-wear"><span class="lbl">' + B.t('look.wear') + '</span>' + l.items.map(function (it) { return '<p>' + it + '</p>'; }).join('') + '</div>';
    $('#lk-add').addEventListener('click', function () { B.close('look-sheet'); B.quickAdd(p.id); });
    B.open('look-sheet');
  });

  /* 색 고르기 */
  $$('.sw button').forEach(function (b) { b.addEventListener('click', function () {
    var c = b.getAttribute('data-color');
    $$('.sw button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    $$('.color .ph img').forEach(function (im) { im.classList.toggle('on', im.getAttribute('data-color') === c); });
    $('#color-link').href = 'product.html?id=' + b.getAttribute('data-pid');
  }); });

  /* 영상 */
  var v = $('#hero-video'), tp = $('#toggle-play');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { v.pause(); v.removeAttribute('autoplay'); }
  tp.addEventListener('click', function () { if (v.paused) { v.play().catch(function () {}); tp.setAttribute('aria-label', '영상 멈춤'); } else { v.pause(); tp.setAttribute('aria-label', '영상 재생'); } });

  /* 뉴스레터 */
  $('#news-form').addEventListener('submit', function (e) { e.preventDefault(); window.location.href = 'account.html?email=' + encodeURIComponent($('#email').value.trim()); });

  $('#about-p').textContent = S.CONTENT.about;
  /* 자주 묻는 질문: 회사가 채운 글(content) */
  var C = S.CONTENT, FAQ = [['그림 실력이 없어도 내 이야기로 주문할 수 있나요?', '네. 이야기와 사진만 주시면 시안은 저희가 그려요. ' + C.revisions], ['제작은 얼마나 걸리나요?', C.lead_time], ['배송비는요?', C.shipping], ['내 신발을 보내도 되나요?', C.own_shoes], ['교환·환불은요?', C.returns], ['어떻게 관리하나요?', C.care], ['사이즈는 어떻게 골라요?', C.size_guide]];
  $('#faq-list').innerHTML = FAQ.map(function (q) { return '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>'; }).join('');
  /* 해시로 들어온 탭 */
  if (location.hash === '#works') $('#works').scrollIntoView();
})();
</script>
</body>
</html>
