<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작품 — BIUM</title>
<link rel="icon" type="image/png" href="assets/brand/logo-black-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Hanken+Grotesk:wght@300;400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/products.js"></script>
</head>
<body>
<main id="main">
  <div class="shop-head"><h1 id="sh-title"></h1><p id="sh-sub"></p></div>
  <div class="shop-bar">
    <div class="mtabs" role="tablist" id="sh-tabs"></div>
    <div class="mright"><span id="sh-chip"></span><label class="sr" for="sh-sort">정렬</label><select id="sh-sort"><option value="">추천순</option><option value="new">새 작품순</option><option value="low">가격 낮은순</option><option value="high">가격 높은순</option><option value="rev">후기 많은순</option></select></div>
  </div>
  <div class="grid" id="sh-grid"></div>
  <p class="empty" id="sh-empty" hidden>이 조건의 작품이 아직 없어요. <a class="ulink" href="studio.html">스튜디오에서 직접 디자인하기</a></p>
</main>
<script src="assets/site.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SHOES, B = window.BIUM;
  var $ = function (s) { return document.querySelector(s); };
  var q = new URLSearchParams(location.search), cat = q.get('cat') || 'all', base = q.get('base') || '', onlyNew = q.get('new') === '1', sort = '';
  var nm = function (x) { return B.lang() === 'en' ? x.en : x.ko; };
  function tabs() {
    var list = [{ id: 'all', ko: '전체 작품', en: 'All' }].concat(S.categories);
    $('#sh-tabs').innerHTML = list.map(function (c) { return '<button role="tab" type="button" data-c="' + c.id + '" aria-selected="' + (c.id === cat) + '">' + nm(c) + '</button>'; }).join('');
    [].forEach.call(document.querySelectorAll('#sh-tabs button'), function (b) { b.onclick = function () { cat = b.getAttribute('data-c'); sync(); }; });
  }
  function sync() {
    var u = new URLSearchParams(); if (cat !== 'all') u.set('cat', cat); if (base) u.set('base', base); if (onlyNew) u.set('new', '1');
    history.replaceState(null, '', 'shop.html' + (u.toString() ? '?' + u : ''));
    var list = S.products.filter(function (p) { return (cat === 'all' || p.cat === cat) && (!base || p.base === base) && (!onlyNew || p.isNew); });
    if (sort === 'low') list.sort(function (a, b) { return a.price - b.price; });
    if (sort === 'high') list.sort(function (a, b) { return b.price - a.price; });
    if (sort === 'rev') list.sort(function (a, b) { return (b.reviews || 0) - (a.reviews || 0); });
    if (sort === 'new') list.sort(function (a, b) { return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0); });
    var c = S.categories.filter(function (x) { return x.id === cat; })[0], bs = S.bases.filter(function (x) { return x.id === base; })[0];
    $('#sh-title').textContent = onlyNew ? (B.lang() === 'en' ? 'New arrivals' : '새 작품') : c ? nm(c) : B.t('shop.h');
    $('#sh-sub').textContent = list.length + (B.lang() === 'en' ? ' works' : '개 작품');
    $('#sh-chip').innerHTML = (bs ? '<button class="chip" type="button" id="x-base">' + nm(bs) + ' ✕</button>' : '') + (onlyNew ? '<button class="chip" type="button" id="x-new">NEW ✕</button>' : '');
    if ($('#x-base')) $('#x-base').onclick = function () { base = ''; sync(); };
    if ($('#x-new')) $('#x-new').onclick = function () { onlyNew = false; sync(); };
    $('#sh-grid').innerHTML = list.map(B.cardHtml).join(''); B.applyLang($('#sh-grid'));
    $('#sh-empty').hidden = !!list.length;
    tabs();
  }
  $('#sh-sort').onchange = function () { sort = this.value; sync(); };
  sync();
})();
</script>
</body>
</html>
