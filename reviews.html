<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후기 — BIUM</title>
<link rel="icon" type="image/png" href="assets/brand/logo-black-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Hanken+Grotesk:wght@300;400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/products.js"></script>
<script src="assets/reviews.js"></script>
</head>
<body>
<main id="main">
  <div class="shop-head"><h1>Review</h1><p id="ra-sub"></p></div>
  <div class="shop-bar">
    <div class="mtabs" role="tablist" id="ra-tabs"></div>
    <div class="mright"><label class="ra-chk"><input type="checkbox" id="ra-photo"> 사진 후기만</label><label class="sr" for="ra-sort">정렬</label><select id="ra-sort"><option value="new">최신순</option><option value="photo">사진 많은순</option></select></div>
  </div>
  <div class="wrap ra">
    <div class="rv-sum" id="ra-sum"></div>
    <div class="rv-strip" id="ra-strip"></div>
    <div id="ra-list"></div>
  </div>
</main>
<script src="assets/site.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SHOES, B = window.BIUM, R = window.REVIEWS || {};
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var SRC = { idus: '아이디어스', smartstore: '스마트스토어' };
  var ALL = [];
  Object.keys(R).forEach(function (id) { var p = B.byId(id); if (!p) return; R[id].forEach(function (r) { ALL.push({ r: r, p: p }); }); });
  var q = new URLSearchParams(location.search), cat = q.get('cat') || 'all', onlyPhoto = q.get('photo') === '1', sort = 'new', shown = 20;
  var star = function (n) { n = Math.round(+n || 0); return '<span class="rv-star" aria-label="별점 ' + n + '">' + '★★★★★'.slice(0, n) + '<i>' + '★★★★★'.slice(0, 5 - n) + '</i></span>'; };
  var nm = function (x) { return B.lang() === 'en' ? x.en : x.ko; };
  function one(x) {
    var r = x.r, p = x.p;
    return '<article class="rv-item ra-item"><a class="ra-prod" href="product.html?id=' + p.id + '#reviews"><img src="' + p.photos[0] + '" alt=""' + B.posAttr(p, 0) + ' loading="lazy"><span>' + esc(B.nameOf(p)) + '</span></a>' +
      '<div><div class="rv-top">' + star(r.rating) + '<span>' + esc(r.name) + '</span><span>' + esc(r.date) + '</span><span>' + (SRC[r.src] || '') + '</span></div>' +
      (r.option ? '<p class="rv-opt">' + esc(r.option) + '</p>' : '') + '<p class="rv-txt">' + esc(r.text).replace(/\n/g, '<br>') + '</p>' +
      ((r.photos || []).length ? '<div class="rv-ph">' + r.photos.map(function (ph) { return '<button type="button" data-zoom="' + esc(ph) + '"><img src="' + esc(ph) + '" alt="후기 사진" loading="lazy"></button>'; }).join('') + '</div>' : '') + '</div></article>';
  }
  function draw() {
    var u = new URLSearchParams(); if (cat !== 'all') u.set('cat', cat); if (onlyPhoto) u.set('photo', '1');
    history.replaceState(null, '', 'reviews.html' + (u.toString() ? '?' + u : ''));
    var list = ALL.filter(function (x) { return (cat === 'all' || x.p.cat === cat) && (!onlyPhoto || (x.r.photos || []).length); });
    list.sort(sort === 'photo' ? function (a, b) { return (b.r.photos || []).length - (a.r.photos || []).length || ((b.r.date || '') > (a.r.date || '') ? 1 : -1); } : function (a, b) { return (b.r.date || '') > (a.r.date || '') ? 1 : -1; });
    var cats = [{ id: 'all', ko: '전체', en: 'All' }].concat(S.categories.filter(function (c) { return ALL.some(function (x) { return x.p.cat === c.id; }); }));
    $('#ra-tabs').innerHTML = cats.map(function (c) { var n = ALL.filter(function (x) { return c.id === 'all' || x.p.cat === c.id; }).length; return '<button role="tab" type="button" data-c="' + c.id + '" aria-selected="' + (c.id === cat) + '">' + nm(c) + ' ' + n + '</button>'; }).join('');
    [].forEach.call(document.querySelectorAll('#ra-tabs button'), function (b) { b.onclick = function () { cat = b.getAttribute('data-c'); shown = 20; draw(); }; });
    var avg = list.length ? (list.reduce(function (s, x) { return s + (+x.r.rating || 0); }, 0) / list.length).toFixed(1) : '';
    $('#ra-sub').textContent = '아이디어스·스마트스토어에 남겨 주신 후기를 모았어요';
    $('#ra-sum').innerHTML = list.length ? '<b>' + avg + '</b>' + star(avg) + '<span>후기 ' + list.length + '개</span>' : '<span>아직 후기가 없어요</span>';
    var photos = []; list.forEach(function (x) { (x.r.photos || []).forEach(function (ph) { photos.push(ph); }); });
    $('#ra-strip').hidden = !photos.length;
    $('#ra-strip').innerHTML = photos.slice(0, 24).map(function (ph) { return '<button type="button" data-zoom="' + esc(ph) + '"><img src="' + esc(ph) + '" alt="후기 사진" loading="lazy"></button>'; }).join('');
    $('#ra-list').innerHTML = list.slice(0, shown).map(one).join('') + (list.length > shown ? '<button class="btn line rv-more" type="button" id="ra-more">후기 더 보기 (' + (list.length - shown) + ')</button>' : '');
    var m = $('#ra-more'); if (m) m.onclick = function () { shown += 20; draw(); };
  }
  $('#ra-photo').checked = onlyPhoto;
  $('#ra-photo').onchange = function () { onlyPhoto = this.checked; shown = 20; draw(); };
  $('#ra-sort').onchange = function () { sort = this.value; draw(); };
  document.querySelector('.ra').addEventListener('click', function (e) { var z = e.target.closest('[data-zoom]'); if (!z) return; var d = document.createElement('div'); d.className = 'rv-zoom'; d.innerHTML = '<img src="' + z.getAttribute('data-zoom') + '" alt="">'; d.onclick = function () { d.remove(); }; document.body.appendChild(d); });
  draw();
})();
</script>
</body>
</html>
